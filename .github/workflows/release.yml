# Pushing a tag like v1.2.3 builds the release assets and publishes a GitHub release.
# Builds the source zip. Edit the release notes on GitHub afterwards if needed.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NAME: ${{ github.event.repository.name }}-${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Source zip
        run: |
          mkdir -p dist
          git archive --format=zip --prefix="$NAME/" -o "dist/$NAME.zip" "$GITHUB_REF_NAME"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "${{ github.event.repository.name }} $GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
